<!DOCTYPE html>
<html>
    <head>
        <title>Cipher Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Import Google Font: Orbitron -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Orbitron', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background-color: #0d1117;
                
                /* Circuit Background */
                background-image: url('https://res.cloudinary.com/ygllvtyg/image/upload/v1785172795/Screenshot_2026-07-27_224856_saundu.png');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                
                color: #00BFFF;
            }

            .main {
                width: 85%;
                max-width: 550px;
                display: flex;
                flex-direction: column;
                gap: 25px;
            }

            /* Title section styling */
            .heading_section {
                border: 2px solid #00BFFF;
                border-radius: 8px;
                padding: 25px 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(10, 15, 30, 0.75);
                backdrop-filter: blur(8px);
                box-shadow: 0 0 15px rgba(0, 191, 255, 0.2);
            }

            /* Turn Encode and Decode into full-box interactive buttons */
            .cipher-btn {
                width: 100%;
                font-family: 'Orbitron', sans-serif;
                background: rgba(10, 15, 30, 0.75);
                backdrop-filter: blur(8px);
                border: 2px solid #00BFFF;
                border-radius: 8px;
                padding: 25px 20px;
                color: #00BFFF;
                cursor: pointer;
                box-shadow: 0 0 15px rgba(0, 191, 255, 0.2);
                transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            }

            /* Hover Glow Effect */
            .cipher-btn:hover {
                transform: translateY(-3px);
                border-color: #00ffff;
                box-shadow: 0 0 25px rgba(0, 191, 255, 0.5), inset 0 0 10px rgba(0, 191, 255, 0.2);
            }

            /* Active Click Effect */
            .cipher-btn:active {
                transform: translateY(0);
            }

            h1 {
                font-size: 24px;
                font-weight: 700;
                letter-spacing: 2px;
                text-transform: uppercase;
                text-shadow: 0 0 10px rgba(0, 191, 255, 0.6);
            }

            h4 {
                font-size: 18px;
                font-weight: 500;
                letter-spacing: 1px;
            }
        </style>
    </head>
    <body>
        <!--Main container-->
        <div class="main">
            <!--Head line-->
            <div class="heading_section">
                <h1>Cipher Code</h1>
            </div>

            <!--Encode Navigation Form-->
            <form action="/encode" method="GET">
                <button type="submit" class="cipher-btn">
                    <h4>Encode</h4>
                </button>
            </form>

            <!--Decode Navigation Form-->
            <form action="/decode" method="GET">
                <button type="submit" class="cipher-btn">
                    <h4>Decode</h4>
                </button>
            </form>
        </div>
    </body>
</html>
