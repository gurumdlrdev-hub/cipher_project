<!DOCTYPE html>
<html>
    <head>
        <title>Sign Up - Cipher Code</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Import Google Font: Orbitron -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Orbitron', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background-color: #0d1117;
                
                /* Same Circuit Background */
                background-image: url('https://res.cloudinary.com/ygllvtyg/image/upload/v1785172795/Screenshot_2026-07-27_224856_saundu.png');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                
                color: #00BFFF;
            }

            .main {
                width: 85%;
                max-width: 550px;
                display: flex;
                flex-direction: column;
                gap: 25px; 
            }

            /* Headline Top Box */
            .heading_section {
                border: 2px solid #00BFFF;
                border-radius: 8px;
                padding: 25px 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(10, 15, 30, 0.75);
                backdrop-filter: blur(8px);
                box-shadow: 0 0 15px rgba(0, 191, 255, 0.2);
            }

            /* Main Form Box matching the bottom wireframe */
            .form_section {
                border: 2px solid #00BFFF;
                border-radius: 8px;
                padding: 35px 30px;
                background: rgba(10, 15, 30, 0.75);
                backdrop-filter: blur(8px);
                box-shadow: 0 0 15px rgba(0, 191, 255, 0.2);
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            h1 {
                font-size: 24px;
                font-weight: 700;
                letter-spacing: 2px;
                text-transform: uppercase;
                text-shadow: 0 0 10px rgba(0, 191, 255, 0.6);
            }

            h2 {
                font-size: 20px;
                font-weight: 600;
                margin-bottom: 5px;
                text-align: center;
                letter-spacing: 1px;
            }

            /* Form Group & Input Fields */
            .input_group {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            label {
                font-size: 14px;
                letter-spacing: 1px;
            }

            input {
                font-family: 'Orbitron', sans-serif;
                background: rgba(5, 10, 20, 0.8);
                border: 1px solid #00BFFF;
                border-radius: 5px;
                padding: 12px 15px;
                color: #00BFFF;
                font-size: 14px;
                outline: none;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            input:focus {
                border-color: #00ffff;
                box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
            }

            input:-webkit-autofill,
            input:-webkit-autofill:hover, 
            input:-webkit-autofill:focus, 
            input:-webkit-autofill:active {
                -webkit-text-fill-color: #00BFFF !important;
                -webkit-box-shadow: 0 0 0px 1000px rgba(5, 10, 20, 0.95) inset !important;
                border: 1px solid #00BFFF !important;
                transition: background-color 5000s ease-in-out 0s;
            }

            /* Submit Button */
            .submit_btn {
                font-family: 'Orbitron', sans-serif;
                background: rgba(10, 15, 30, 0.9);
                border: 2px solid #00BFFF;
                border-radius: 5px;
                padding: 14px;
                color: #00BFFF;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                letter-spacing: 1px;
                margin-top: 10px;
                transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            }

            .submit_btn:hover {
                transform: translateY(-2px);
                border-color: #00ffff;
                box-shadow: 0 0 20px rgba(0, 191, 255, 0.5);
            }

            /* Bottom Toggle Link */
            .toggle_link {
                text-align: center;
                font-size: 12px;
                margin-top: 5px;
            }

            .toggle_link a {
                color: #00ffff;
                text-decoration: none;
            }

            .toggle_link a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <!-- Headline Heading Area -->
            <div class="heading_section">
                <h1>Cipher Code</h1>
            </div>

            <!-- Sign Up Box Area -->
            <div class="form_section">
                <h2>Sign Up</h2>
                
                <form action="/signup" method="POST" style="display: flex; flex-direction: column; gap: 18px;">
                    <div class="input_group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="input_group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create password" required>
                    </div>
                    <button type="submit" class="submit_btn">Create Account</button>
                </form>

                <div class="toggle_link">
                    Already have an account? <a href="/login">Login</a>
                </div>
            </div>
        </div>
    </body>
</html>
